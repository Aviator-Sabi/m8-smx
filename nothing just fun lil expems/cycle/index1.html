<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle Configurator</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div id="wrap">
        <input type="checkbox" class="initial">
        <input type="radio" name="wheel" class="wheel1">
        <input type="radio" name="wheel" class="wheel2">
        <input type="radio" name="wheel" class="wheel3">
        <input type="radio" name="wheel" class="wheel4">
        <input type="checkbox" class="buy">
        
        <h1>Configure the bike</h1>
        <h2>Add to cart</h2>
        <h3>Wheels</h3>

        <div class="wheeltoggle"></div>
        <div class="wheeltoggle"></div>
        <div class="wheeltoggle"></div>
        <div class="wheeltoggle"></div>

        <div class="buy"></div>
        
        <div class="toggle expand">
            <i class="fas fa-bicycle"></i>
        </div>
        
        <div class="background"></div>
        <div class="frame">
            <div class="rear"></div>
            <div class="stem"></div>
            <div class="shaft"></div>
            <div class="seat"></div>
            
            <div class="wheel on front">
                <div class="inner"></div>
            </div>
            
            <div class="wheelo on back">
                <div class="inner">Converted HAML code</div>
            </div>
        </div>
    </div>
</body>
</html>
