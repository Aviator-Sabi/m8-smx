<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <section class="blog-section">
        <div class="blog-header">
            <p class="blog-subtitle">FROM THE BLOG</p>
            <h2 class="blog-title">Recent Blog Posts</h2>
            <p class="blog-description">Show your most recent blog posts on any website page</p>
        </div>
        <div class="blog-grid">
            <!-- Blog Post 1 -->
            <div class="blog-card">
                <img src="img/person on computer.png" alt="Building a HubSpot integration with Zapier">
                <h3 class="blog-card-title">Building a HubSpot integration with Zapier</h3>
            </div>
            <!-- Blog Post 2 -->
            <div class="blog-card">
                <img src="img/person-typing.jpg" alt="How to build a website on HubSpot CMS without a developer">
                <h3 class="blog-card-title">How to build a website on HubSpot CMS without a developer</h3>
            </div>
            <!-- Blog Post 3 -->
            <div class="blog-card">
                <img src="img/tips.jpg" alt="10 tips for website conversion rate optimization">
                <h3 class="blog-card-title">10 tips for website conversion rate optimization</h3>
            </div>
        </div>
        <button class="view-posts-button">View Posts</button>
    </section>
</body>
</html>
