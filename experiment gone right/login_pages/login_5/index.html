    <section class="span-container">
      
     
<script>
  const spanContainer = document.getElementsByClassName('span-container')[0];  // Select the first item
  const spanCount = 200;  // Adjust the count as needed

  for (let i = 0; i < spanCount; i++) {
      const span = document.createElement('span');
      spanContainer.appendChild(span);
  }
</script>
